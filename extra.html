<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Slider</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }

        .slider-wrapper {
            position: relative;
            width: 80%;
            max-width: 1100px;
        }

        .slider-container {
            overflow: hidden;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .slider-track {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: scroll 20s linear infinite; 
        }

        .slide-item {
            flex: 0 0 auto;
            width: 150px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @keyframes scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .slider-container:hover .slider-track {
            animation-play-state: paused;
        }

        /* Navigation Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: whitesmoke;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 50px;
            z-index: 10;
        }

        .nav-btn:hover {
            background: #444;
        }

        .nav-left { left: -50px; }
        .nav-right { right: -50px; }

    </style>
</head>

<body>

<div class="slider-wrapper">

    <button class="nav-btn nav-right" onclick="scrollRight()">›</button>

<script>
const track = document.getElementById("sliderTrack");

/* Duplicate all slides for seamless infinite effect */

/* Navigation Controls */

}

function scrollRight() {
