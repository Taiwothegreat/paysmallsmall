<script>
(function(){
  // Run after DOM ready
  function ready(fn){ if (document.readyState !== 'loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }

  ready(() => {

    /* ===========================
       CONFIG
       =========================== */
    const PRODUCTS_PER_PAGE = 20;

    /* ===========================
       DOM ELEMENTS (safely grabbed)
       =========================== */
    const slider = document.getElementById('productSlider') || null;
    const sliderContainer = document.querySelector('.slider-container') || null;
    const prevBtn = document.getElementById('prevBtn') || null;
    const nextBtn = document.getElementById('nextBtn') || null;

    const galleryContainer = document.getElementById('product-gallery') || null; // where paginated clones go
    const paginationDiv = document.getElementById('pagination') || null;

    const searchInput = document.getElementById('searchInput') || null;
    const suggestionBox = document.getElementById('suggestionBox') || null;

    // jQuery modal - guard in case jQuery isn't loaded
    const modalEl = (typeof window.jQuery !== 'undefined' && window.jQuery('#productModal')) ? window.jQuery('#productModal') : null;
    const modalTitle = document.getElementById('modalTitle') || null;
    const modalImage = document.getElementById('modalImage') || { src: '' };
    const modalDescription = document.getElementById('modalDescription') || null;
    const modalPrice = document.getElementById('modalPrice') || null;
    const installmentCalendar = document.getElementById('installmentCalendar') || null;
    const installmentResult = document.getElementById('installmentResult') || null;

    /* ===========================
       UTILS
       =========================== */
    function parsePrice(raw) {
      if (raw == null) return 0;
      return Number(String(raw).replace(/[^0-9.-]+/g, '')) || 0;
    }
    function trimDataName(el) {
      return (el && el.getAttribute) ? (el.getAttribute('data-name') || '').trim() : '';
    }

    /* ===========================
       MASTER PRODUCT LIST
       - grab product cards now that DOM is ready
       =========================== */
    const masterCards = Array.from(document.querySelectorAll('.product-card') || []);
    const galleryItems = masterCards.map(card => {
      const clone = card.cloneNode(true);
      clone.style.marginBottom = '20px';
      clone.classList.add('gallery-item'); // marker for gallery clones
      return clone;
    });

    /* ===========================
       PAGINATION / RENDERING
       =========================== */
    let filteredItems = [...galleryItems];
    let currentPage = 1;

    function renderGalleryPage(page = 1) {
      if (!galleryContainer) {
        console.warn('renderGalleryPage: #product-gallery not found.');
        return;
      }

      currentPage = page;
      galleryContainer.innerHTML = ''; // empty then append slice
      const start = (page - 1) * PRODUCTS_PER_PAGE;
      const end = start + PRODUCTS_PER_PAGE;
      const slice = filteredItems.slice(start, end);

      if (slice.length === 0) {
        galleryContainer.innerHTML = '<div class="col-xs-12"><p style="text-align:center;">No products found.</p></div>';
      } else {
        slice.forEach(item => galleryContainer.appendChild(item));
      }

      renderPagination();
        // ⭐ SCROLL TO TOP OF THE PRODUCT SECTION ⭐
  window.scrollTo({
    top: document.getElementById("product-gallery").offsetTop - 100,
    behavior: "smooth"
  });
    }

    /* ===========================
       FIXED PAGINATION
       =========================== */
    function renderPagination() {
      if (!paginationDiv) {
        // no pagination container on this page — skip silently
        return;
      }

      paginationDiv.innerHTML = '';

      const totalPages = Math.ceil(filteredItems.length / PRODUCTS_PER_PAGE);
      if (totalPages <= 1) return; // Hide pagination if only 1 page

      // Previous Button
      const prev = document.createElement("button");
      prev.textContent = "Previous";
      prev.className = "btn btn-default";
      prev.disabled = currentPage === 1;
      prev.style.marginRight = "5px";
      prev.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderGalleryPage(currentPage);
        }
      };
      paginationDiv.appendChild(prev);

      // Page Numbers
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = "btn " + (i === currentPage ? "btn-primary" : "btn-default");
        btn.style.marginRight = "3px";
        btn.onclick = () => {
          currentPage = i;
          renderGalleryPage(i);
        };
        paginationDiv.appendChild(btn);
      }

      // Next Button
      const next = document.createElement("button");
      next.textContent = "Next";
      next.className = "btn btn-default";
      next.disabled = currentPage === totalPages;
      next.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderGalleryPage(currentPage);
        }
      };
      paginationDiv.appendChild(next);
    }

    /* ===========================
       SEARCH & SUGGESTIONS
       =========================== */
    function updateSearchSuggestions(keyword) {
      if (!suggestionBox) return;
      suggestionBox.innerHTML = '';
      if (!keyword) { suggestionBox.style.display = 'none'; return; }

      const matches = galleryItems.filter(it => (it.getAttribute('data-name') || '').toLowerCase().includes(keyword));
      matches.slice(0, 10).forEach(match => {
        const div = document.createElement('div');
        div.textContent = (match.getAttribute('data-name') || '').trim();
        div.onclick = () => {
          const name = match.getAttribute('data-name').trim();
          const original = masterCards.find(m => (m.getAttribute('data-name') || '').trim() === name) || match;
          openProductFromCard(original);
          suggestionBox.style.display = 'none';
          if (searchInput) searchInput.value = '';
          filteredItems = [...galleryItems];
          renderGalleryPage(1);
        };
        suggestionBox.appendChild(div);
      });

      suggestionBox.style.display = suggestionBox.children.length ? 'block' : 'none';
    }

    function doSearch() {
      if (!searchInput) return;
      const keyword = (searchInput.value || '').toLowerCase().trim();
      if (suggestionBox) { suggestionBox.innerHTML = ''; suggestionBox.style.display = 'none'; }

      if (!keyword) {
        filteredItems = [...galleryItems];
        renderGalleryPage(1);
        return;
      }

      filteredItems = galleryItems.filter(item => {
        const name = (item.getAttribute('data-name') || '').toLowerCase();
        const desc = (item.getAttribute('data-desc') || '').toLowerCase();
        return name.includes(keyword) || desc.includes(keyword) || item.innerText.toLowerCase().includes(keyword);
      });

      if (keyword && suggestionBox) updateSearchSuggestions(keyword);
      renderGalleryPage(1);
    }

    if (searchInput) {
      searchInput.addEventListener('keyup', () => doSearch());
    }

    /* close suggestion on outside click */
    document.addEventListener('click', (ev) => {
      if (suggestionBox && !suggestionBox.contains(ev.target) && ev.target !== searchInput) {
        suggestionBox.style.display = 'none';
      }
    });

    /* ===========================
       SLIDER (ACCESSORIES) - infinite auto-scroll
       =========================== */
    let sliderSpeed = 60;
    let paused = false;
    let pos = 0;
    let originalWidth = 0;
    let rafId = null;
    let lastTime = null;
    let cardFullWidth = 0;
    let originalCount = 0;

    function setupInfiniteSlider() {
      try {
        if (!slider) return;
        slider.style.transition = '';
        pos = 0; lastTime = null; paused = false;
        Array.from(slider.children).forEach(ch => { if (ch.dataset && ch.dataset.clone) ch.remove(); });

        const originalChildren = Array.from(slider.querySelectorAll('.accessory'));
        originalCount = originalChildren.length;
        if (!originalCount) return;

        const first = originalChildren[0];
        const st = window.getComputedStyle(first);
        const ml = parseFloat(st.marginLeft) || 0, mr = parseFloat(st.marginRight) || 0;
        cardFullWidth = Math.round(first.getBoundingClientRect().width + ml + mr);
        originalWidth = cardFullWidth * originalCount;

        for (let i = 0; i < originalCount; i++) {
          const clone = originalChildren[i].cloneNode(true);
          clone.dataset.clone = '1';
          slider.appendChild(clone);
        }

        slider.style.transform = `translateX(${pos}px)`;
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(stepSlider);
      } catch (err) {
        console.warn('setupInfiniteSlider error', err);
      }
    }
    function stepSlider(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      if (!paused && slider && originalWidth) {
        pos -= sliderSpeed * dt;
        if (Math.abs(pos) >= originalWidth) pos += originalWidth;
        slider.style.transform = `translateX(${pos}px)`;
      }
      rafId = requestAnimationFrame(stepSlider);
    }
    if (sliderContainer) {
      sliderContainer.addEventListener('mouseenter', () => paused = true);
      sliderContainer.addEventListener('mouseleave', () => paused = false);
    }
    if (nextBtn) nextBtn.addEventListener('click', () => manualShift(1));
    if (prevBtn) prevBtn.addEventListener('click', () => manualShift(-1));

    function manualShift(direction) {
      paused = true;
      if (!cardFullWidth || !originalWidth || !slider) return;
      pos -= direction * cardFullWidth;
      if (Math.abs(pos) >= originalWidth) pos += originalWidth * Math.sign(pos);
      slider.style.transition = 'transform 0.35s ease';
      slider.style.transform = `translateX(${pos}px)`;
      setTimeout(() => { slider.style.transition = ''; setTimeout(() => paused = false, 200); }, 360);
    }

    if (typeof window !== 'undefined') {
      window.addEventListener('load', () => { try { setupInfiniteSlider(); } catch (e) { /* ignore */ } });
      window.addEventListener('resize', () => { clearTimeout(window._sliderResizeTimer); window._sliderResizeTimer = setTimeout(setupInfiniteSlider, 250); });
    }

    /* ===========================
       MODAL / CART / WISHLIST
       =========================== */
    let selectedProduct = '';
    let selectedPrice = 0;
    let selectedPlan = '';
    let selectedDuration = 0;
    let selectedImg = '';

    function openProduct(name, price, desc, img) {
      selectedProduct = name;
      selectedPrice = parsePrice(price);
      selectedPlan = '';
      selectedDuration = 0;

      if (modalTitle) modalTitle.textContent = name || '';
      if (modalPrice) modalPrice.textContent = "₦" + selectedPrice.toLocaleString();
      if (modalImage && modalImage.src !== undefined) modalImage.src = img || '';
      if (modalDescription) modalDescription.innerHTML = (desc || '').replace(/\n/g, '<br>');

      if (installmentResult) installmentResult.textContent = '';
      if (installmentCalendar) { installmentCalendar.innerHTML = ''; installmentCalendar.style.display = 'none'; }

      if (modalEl && typeof modalEl.modal === 'function') {
        modalEl.modal('show');
      } else {
        // fallback: no jQuery modal — ensure there's a visible way to show product
        console.info('Modal not available: product opened in modal fallback.');
      }
    }

    function openProductFromCard(el) {
      if (!el) return;
      const name = (el.getAttribute('data-name') || '').trim();
      const price = el.getAttribute('data-price') || el.dataset.price || '';
      const img = el.getAttribute('data-img') || el.dataset.img || '';
      const desc = el.getAttribute('data-desc') || el.dataset.desc || el.innerText || '';

      openProduct(name, price, desc, img);
    }

    // click delegation - open modal when a product-card (or gallery-item) is clicked
    document.addEventListener('click', function(e) {
      const wish = e.target.closest && e.target.closest('.wishlist-icon');
      if (wish) return; // don't open modal when wish icon clicked

      const card = e.target.closest && e.target.closest('.product-card');
      if (card) {
        openProductFromCard(card);
      }
    });

    /* Payment plan selection (keeps original names and behavior) */
    function selectPayment(type) {
      selectedPlan = type;
      selectedDuration = 0;
      if (installmentCalendar) installmentCalendar.innerHTML = '';
      if (installmentResult) installmentResult.textContent = '';

      if (type === 'weekly' && installmentCalendar) {
        installmentCalendar.style.display = 'block';
        for (let i = 2; i <= 48; i += 2) {
          if (i === 46) continue;
          const d = document.createElement('div');
          d.className = 'calendar-number';
          d.textContent = i;
          d.onclick = () => pickDuration(i);
          installmentCalendar.appendChild(d);
        }
      } else if (type === 'monthly' && installmentCalendar) {
        installmentCalendar.style.display = 'block';
        for (let i = 2; i <= 12; i++) {
          const d = document.createElement('div');
          d.className = 'calendar-number';
          d.textContent = i;
          d.onclick = () => pickDuration(i);
          installmentCalendar.appendChild(d);
        }
     /* } else if (installmentResult) {
        installmentResult.textContent = `Total Price: ₦${selectedPrice.toLocaleString()}`;
      }*/
      } else if (type === 'once' && installmentResult) {
  let shippingFee = Math.round(selectedPrice * 0.05);
  let totalWithShipping = selectedPrice + shippingFee;

  installmentResult.innerHTML = `
    Product Price: ₦${selectedPrice.toLocaleString()}<br>
    Installation / Shipping (5%): ₦${shippingFee.toLocaleString()}<br>
    <strong>Total Payable: ₦${totalWithShipping.toLocaleString()}</strong>
  `;
}

    }

    function pickDuration(val) {
      selectedDuration = val;
      calculateInstallment(val);
      Array.from(document.querySelectorAll('#installmentCalendar .calendar-number')).forEach(el => {
        el.style.background = '#f0f0f0';
        el.style.color = '';
      });
      const picked = Array.from(document.querySelectorAll('#installmentCalendar .calendar-number')).find(el => el.textContent == String(val));
      if (picked) { picked.style.background = '#2b6'; picked.style.color = '#fff'; }
    }

    function calculateInstallment(value) {
      if (!selectedPlan) return;
      let shippingFee = Math.round(selectedPrice * 0.05);
      let baseInstallment = Math.round(selectedPrice / Number(value));
      let perLabel = (selectedPlan === 'weekly') ? 'per week' : 'per month';
      let unitLabel = (selectedPlan === 'weekly') ? 'weeks' : 'months';
      let firstInstallment = baseInstallment + shippingFee;

      if (installmentResult) {
        installmentResult.innerHTML = `
          First installment (includes 5% shipping): ₦${firstInstallment.toLocaleString()} <br>
          Remaining ${value - 1} ${unitLabel}: ₦${baseInstallment.toLocaleString()} ${perLabel} each
        `;
      }
    }

    // addToCart / addToWishlist / toggleWishlist --- unchanged but guarded where DOM is required
    function addToCart() {
      if (!selectedProduct) { alert('Open a product first.'); return; }
      const item = { name: selectedProduct, price: selectedPrice, plan: selectedPlan || 'Buy Once', duration: selectedDuration || null, image: (modalImage && modalImage.src) || '' };
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.push(item);
      localStorage.setItem('cart', JSON.stringify(cart));
      fetch('cart_api.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action: 'add', product: item })
      }).catch(()=>{});
      alert(selectedProduct + ' added to cart');
    }

    function addToWishlist() {
      if (!selectedProduct) { alert('Open a product first.'); return; }
      const item = { name: selectedProduct, price: selectedPrice, image: (modalImage && modalImage.src) || '' };
      let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
      if (wishlist.find(w => w.name === item.name)) { alert('Already in wishlist'); return; }
      wishlist.push(item);
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
      fetch('wishlist_api.php', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: 'add', product: item }) }).catch(()=>{});
      alert(selectedProduct + ' added to wishlist');
    }

    function toggleWishlist(e, iconEl) {
      if (e && e.stopPropagation) e.stopPropagation();
      const card = iconEl && iconEl.closest && iconEl.closest('.product-card');
      if (!card) return;
      const name = (card.getAttribute('data-name') || '').trim();
      const price = parsePrice(card.getAttribute('data-price') || card.dataset.price);
      const image = card.getAttribute('data-img') || card.dataset.img || '';

      let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
      const exists = wishlist.find(w => w.name === name);
      if (exists) {
        wishlist = wishlist.filter(w => w.name !== name);
        iconEl.classList.remove('active');
        fetch('wishlist_api.php', { method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action:'remove', product: { name, price, image } }) }).catch(()=>{});
      } else {
        wishlist.push({ name, price, image });
        iconEl.classList.add('active');
        fetch('wishlist_api.php', { method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action:'add', product: { name, price, image } }) }).catch(()=>{});
      }
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
    }

    /* proceedToPayment (keeps original logic; refer to readTerms checkbox if present on page) */
    function proceedToPayment() {
      if (selectedPlan === '') return alert('Please choose a payment option.');
      if (selectedPlan !== 'once' && selectedDuration === 0) return alert('Please select duration from the calendar.');

      // If the page has a #readTerms checkbox, enforce it
      const readTermsEl = document.getElementById('readTerms');
      if (readTermsEl && !readTermsEl.checked) return alert('Please read and acknowledge after sales support/returns before proceeding.');

      const planType = (selectedPlan === 'once') ? 'Buy Once' : (selectedPlan === 'weekly' ? 'Weekly' : 'Monthly');
      const totalPrice = selectedPrice;
      const amountDue = (selectedPlan === 'once') ? totalPrice : Math.round(totalPrice / selectedDuration);
      const balance = (selectedPlan === 'once') ? 0 : totalPrice - amountDue;

      const orderID = "PS" + Math.floor(100000 + Math.random() * 900000);

      const payload = {
        orderID,
        name: selectedProduct,
        plan: planType,
        amountDue,
        balance,
        duration: selectedDuration,
        price: totalPrice,
        image: selectedImg || (modalImage && modalImage.src) || ''
      };

      localStorage.setItem('checkout', JSON.stringify(payload));
      window.location.href = 'payment.html';
    }

    // expose proceedToPayment / addToCart / addToWishlist / selectPayment to global scope if other inline buttons call them
    window.proceedToPayment = proceedToPayment;
    window.addToCart = addToCart;
    window.addToWishlist = addToWishlist;
    window.selectPayment = selectPayment;
    window.toggleWishlist = toggleWishlist;
    window.openProductFromCard = openProductFromCard; // ensure it's globally available

    /* ===========================
       INITIALIZE GALLERY (first render)
       =========================== */
    filteredItems = [...galleryItems];
    renderGalleryPage(1);

    /* Make sure wishlist icons are clickable */
    document.querySelectorAll('.wishlist-icon').forEach(icon => {
      icon.style.cursor = 'pointer';
    });

    // finished setup
    console.info('Product gallery script initialized safely.');

  }); // end ready
})(); // end IIFE
</script>
