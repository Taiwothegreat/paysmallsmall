<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paysmallsmall Products</title>

    <!-- Bootstrap 3 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

<!-- SEARCH SECTION -->
<style>
    #searchSection {
        width: 80%;
        margin: 30px auto;
        text-align: center;
    }

    #searchInput {
        width: 60%;
        height: 45px;
        padding: 10px;
        font-size: 16px;
    }

    #searchBtn {
        height: 45px;
        padding: 0 20px;
        font-size: 16px;
    }

    #searchResults {
        width: 60%;
        margin: auto;
        display: none;
        position: absolute;
        left: 20%;
        z-index: 1000;
        max-height: 250px;
        overflow-y: auto;
    }

    #searchGallery {
        margin-top: 20px;
        display: none;
    }

    .search-product-box {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        text-align: center;
        cursor: pointer;
    }

    .search-product-box img {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 5px;
    }
</style>


<div id="searchSection">
    <input type="text" id="searchInput" placeholder="Search for products…" class="form-control">
    <button id="searchBtn" class="btn btn-primary">Search</button>

    <ul id="searchResults" class="list-group"></ul>

    <div id="searchGallery" class="row"></div>
</div>


<!-- PRODUCT MODAL (this must exist already – keep yours if you have one) -->
<div id="productModal" class="modal fade">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h4 id="modalTitle"></h4>
            </div>

            <div class="modal-body">
                <img id="modalImage" style="width:100%; max-height:350px; object-fit:cover;">
                <h3 id="modalPrice" style="color:#28a745; margin-top:10px;"></h3>
                <p id="modalDescription"></p>

                <div id="installmentCalendar">
                    <!-- your payment options appear here -->
                </div>
            </div>

        </div>
    </div>
</div>


<script>
/* ---------------------------------------------------------
    1️⃣ PRODUCT LIST (Auto-read from product cards)
--------------------------------------------------------- */
var products = [];

document.querySelectorAll(".product-card").forEach(card => {
    products.push({
        name: card.getAttribute("data-name"),
        price: card.getAttribute("data-price"),
        img: card.getAttribute("data-img"),
        desc: card.getAttribute("data-desc") || ""
    });
});


/* ---------------------------------------------------------
    2️⃣ LIVE SEARCH SUGGESTIONS (Start after 3 letters)
--------------------------------------------------------- */
document.getElementById("searchInput").addEventListener("keyup", function () {
    let input = this.value.toLowerCase();
    let resultBox = document.getElementById("searchResults");

    resultBox.innerHTML = "";
    if (input.length < 3) {
        resultBox.style.display = "none";
        return;
    }

    let results = products.filter(p => p.name.toLowerCase().includes(input));

    if (results.length === 0) {
        resultBox.style.display = "none";
        return;
    }

    results.forEach(item => {
        let li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = item.name;

        li.onclick = function () {
            document.getElementById("searchInput").value = item.name;
            resultBox.style.display = "none";
            openProductFromSearch(item.name);
        };

        resultBox.appendChild(li);
    });

    resultBox.style.display = "block";
});


/* ---------------------------------------------------------
    3️⃣ SEARCH BUTTON (Show products in gallery)
--------------------------------------------------------- */
document.getElementById("searchBtn").addEventListener("click", function () {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let matches = products.filter(p => p.name.toLowerCase().includes(input));

    let gallery = document.getElementById("searchGallery");
    gallery.innerHTML = "";
    gallery.style.display = "block";

    matches.forEach(p => {
        let col = document.createElement("div");
        col.className = "col-xs-6 col-sm-3";
        col.style.marginBottom = "15px";

        col.innerHTML = `
            <div class="search-product-box" onclick="openProductFromSearch('${p.name}')">
                <img src="${p.img}">
                <h5>${p.name}</h5>
                <div style="color:#28a745; font-weight:bold;">₦${p.price}</div>
            </div>
        `;

        gallery.appendChild(col);
    });
});


/* ---------------------------------------------------------
    4️⃣ OPEN PRODUCT MODAL FROM SEARCH
--------------------------------------------------------- */
function openProductFromSearch(name) {
    let item = products.find(p => p.name === name);
    if (!item) return;

    openProductFromCardData(item.name, item.price, item.img, item.desc);
}


/* ---------------------------------------------------------
    5️⃣ INSERT PRODUCT DETAILS INTO MODAL
--------------------------------------------------------- */
function openProductFromCardData(name, price, img, desc) {
    document.getElementById("modalTitle").textContent = name;
    document.getElementById("modalPrice").textContent = "₦" + price;
    document.getElementById("modalImage").src = img;
    document.getElementById("modalDescription").textContent = desc;

    document.getElementById("installmentCalendar").style.display = "block";
    $("#productModal").modal("show");
}
</script>

</html>
